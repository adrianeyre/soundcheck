[package]
name = "soundcheck-test-effect"
version = "0.1.0"
description = "The Plugin Effect the hosts are tested with, written against the SDK"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib for the .wasm Plugin the hosts load, rlib so its own tests can run
# the same DSP natively and check the expected output.
crate-type = ["cdylib", "rlib"]

[dependencies]
soundcheck-sdk = { version = "1.0.0", path = ".." }

[dev-dependencies]
serde_json = "1.0.151"
