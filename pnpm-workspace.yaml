packages:
  - app
  - site

# wasm-pack's npm package downloads its binary in a postinstall script.
# esbuild's (tsx's, for `real-model-check`) only checks the platform binary
# its optional dependency already installed, so it needn't run. @google/genai's
# preinstall is a no-op echo, and protobufjs's postinstall (its dependency) only
# warns about version schemes.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
  wasm-pack: true

minimumReleaseAgeExclude:
  - lucide-react@1.67.0
  - '@ai-hero/sandcastle@0.14.0'
  - '@oxlint/binding-android-arm-eabi@1.91.0'
  - '@oxlint/binding-android-arm64@1.91.0'
  - '@oxlint/binding-darwin-arm64@1.91.0'
  - '@oxlint/binding-darwin-x64@1.91.0'
  - '@oxlint/binding-freebsd-x64@1.91.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.91.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.91.0'
  - '@oxlint/binding-linux-arm64-gnu@1.91.0'
  - '@oxlint/binding-linux-arm64-musl@1.91.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.91.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.91.0'
  - '@oxlint/binding-linux-riscv64-musl@1.91.0'
  - '@oxlint/binding-linux-s390x-gnu@1.91.0'
  - '@oxlint/binding-linux-x64-gnu@1.91.0'
  - '@oxlint/binding-linux-x64-musl@1.91.0'
  - '@oxlint/binding-openharmony-arm64@1.91.0'
  - '@oxlint/binding-win32-arm64-msvc@1.91.0'
  - '@oxlint/binding-win32-ia32-msvc@1.91.0'
  - '@oxlint/binding-win32-x64-msvc@1.91.0'
  - openai@7.48.0
  - oxlint@1.91.0

# conventional-changelog-conventionalcommits 10 renders only with
# conventional-changelog-writer 9, and the latest
# @semantic-release/release-notes-generator (14.1.1) still asks for ^8.
# Writer 9 keeps the API it calls (writeChangelogString); drop this once
# release-notes-generator depends on writer 9 itself.
overrides:
  conventional-changelog-writer: ^9.3.0
