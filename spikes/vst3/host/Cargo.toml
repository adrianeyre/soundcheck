# A throwaway spike for #69: the Desktop App's side of hosting VST3 Plugins in a
# separate process. Its own workspace, so nothing here is built, linted or tested
# with the app.
[workspace]

[package]
name = "spike-vst3-host"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.23.1"
json5 = "1.3.1"
# The latest stable release; 1.0 is still an alpha.
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
